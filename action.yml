name: "Bearer Action"
description: "Bearer is a free and open SAST tool that analyzes your source code to help find and fix security and privacy risks."
branding:
  icon: "check-square"
  color: "purple"
inputs:
  version:
    description: "Bearer release to use. Latest is resolved daily and cached with its SHA-256."
    required: false
    default: "latest"
  scanner:
    description: "Specify the comma separated scanners e.g. --scanner secrets,sast"
    required: false
    default: ""
  config-file:
    description: "configuration file path"
    required: false
    default: ""
  bearer-ignore-file:
    description: "bearer.ignore file path"
    required: false
    default: ""
  only-rule:
    description: "Specify the comma-separated ids of the rules you would like to run. Skips all other rules."
    required: false
    default: ""
  skip-rule:
    description: "Specify the comma-separated ids of the rules you would like to skip. Runs all other rules."
    required: false
    default: ""
  skip-path:
    description: "Specify the comma separated files and directories to skip. Supports * syntax, e.g. --skip-path users/*.go,users/admin.sql"
    required: false
    default: ""
  exclude-fingerprint:
    description: "Specify the comma-separated fingerprints of the findings you would like to exclude from the report."
    required: false
    default: ""
  severity:
    description: "Specify which severities are included in the report as a comma separated string"
    required: false
    default: ""
  format:
    description: "Specify which format to use for the report (json, yaml, sarif, gitlab-sast)"
    required: false
    default: ""
  output:
    description: "Specify where to store the report"
    required: false
    default: ""
  api-key:
    description: "For use with Bearer Cloud"
    required: false
    default: ""
  diff:
    description: "Enable differential scanning. Only supported for pull request events"
    required: false
    default: "false"
  quiet:
    description: "Suppress non-essential messages"
    required: false
    default: ""
  hide-progress-bar:
    description: "Hide progress bar from output"
    required: false
    default: "true"
  exit-code:
    description: "Forces the exit-code when errors are reported"
    required: false
    default: ""
  path:
    description: "The path to scan"
    required: false
    default: "."
outputs:
  binary_cache_hit:
    description: "Whether the verified binary archive was restored from its exact cache key."
    value: ${{ steps.binary-cache.outputs.cache-hit }}
  rules_cache_hit:
    description: "Whether the current daily rules cache was restored."
    value: ${{ steps.rules-cache.outputs.cache-hit }}
  rule_breaches:
    description: "Details of any rule breaches that occur"
    value: ${{ steps.run.outputs.rule_breaches }}
  exit_code:
    description: "exit code from binary"
    value: ${{ steps.run.outputs.exit_code }}
runs:
  using: "composite"
  steps:
    - id: cache-info
      shell: bash
      env:
        BEARER_VERSION: ${{ inputs.version }}
      run: bash "$GITHUB_ACTION_PATH/scripts/cache-info.sh"
    - id: release-cache
      uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae
      with:
        path: ${{ steps.cache-info.outputs.release-file }}
        key: ${{ steps.cache-info.outputs.release-key }}
        restore-keys: ${{ steps.cache-info.outputs.release-prefix }}
    - id: downloads
      shell: bash
      env:
        BEARER_RELEASE_FILE: ${{ steps.cache-info.outputs.release-file }}
        BEARER_RELEASE_URL: ${{ steps.cache-info.outputs.release-url }}
        BEARER_PLATFORM: ${{ steps.cache-info.outputs.platform }}
        BEARER_RELEASE_CACHE_HIT: ${{ steps.release-cache.outputs.cache-hit }}
        GITHUB_TOKEN: ${{ github.token }}
      run: bash "$GITHUB_ACTION_PATH/scripts/download-info.sh"
    - uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae
      if: steps.release-cache.outputs.cache-hit != 'true'
      with:
        path: ${{ steps.cache-info.outputs.release-file }}
        key: ${{ steps.cache-info.outputs.release-key }}
    - id: binary-cache
      uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae
      with:
        path: ${{ steps.downloads.outputs.archive }}
        key: ${{ steps.downloads.outputs.binary-key }}
    - shell: bash
      env:
        BEARER_ARCHIVE: ${{ steps.downloads.outputs.archive }}
        BEARER_URL: ${{ steps.downloads.outputs.url }}
        BEARER_CHECKSUM: ${{ steps.downloads.outputs.checksum }}
      run: bash "$GITHUB_ACTION_PATH/scripts/install.sh"
    - uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae
      if: steps.binary-cache.outputs.cache-hit != 'true'
      with:
        path: ${{ steps.downloads.outputs.archive }}
        key: ${{ steps.downloads.outputs.binary-key }}
    - id: rules-cache
      uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae
      with:
        path: ${{ steps.cache-info.outputs.rules-directory }}
        key: ${{ steps.cache-info.outputs.rules-key }}
        restore-keys: ${{ steps.cache-info.outputs.rules-prefix }}
    - shell: bash
      env:
        BEARER_RULES_DIRECTORY: ${{ steps.cache-info.outputs.rules-directory }}
      run: bash "$GITHUB_ACTION_PATH/scripts/validate-rules.sh"
    - id: run
      shell: bash
      env:
        BEARER_SCANNER: ${{ inputs.scanner }}
        BEARER_CONFIG_FILE: ${{ inputs.config-file }}
        BEARER_IGNORE_FILE: ${{ inputs.bearer-ignore-file }}
        BEARER_ONLY_RULE: ${{ inputs.only-rule }}
        BEARER_SKIP_RULE: ${{ inputs.skip-rule }}
        BEARER_SKIP_PATH: ${{ inputs.skip-path }}
        BEARER_EXCLUDE_FINGERPRINT: ${{ inputs.exclude-fingerprint }}
        BEARER_FORMAT: ${{ inputs.format }}
        BEARER_OUTPUT: ${{ inputs.output }}
        BEARER_EXIT_CODE: ${{ inputs.exit-code }}
        BEARER_SEVERITY: ${{ inputs.severity }}
        BEARER_API_KEY: ${{ inputs.api-key }}
        BEARER_QUIET: ${{ inputs.quiet }}
        BEARER_HIDE_PROGRESS_BAR: ${{ inputs.hide-progress-bar }}
        SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        CURRENT_BRANCH: ${{ github.head_ref }}
        DIFF_BASE_BRANCH: ${{ fromJSON(inputs.diff) && github.base_ref || '' }}
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        GITHUB_TOKEN: ${{ github.token }}
        BEARER_SCAN_PATH: ${{ inputs.path }}
      run: |
        set +e
        RULE_BREACHES=$("$RUNNER_TEMP/bearer" scan "$BEARER_SCAN_PATH")
        SCAN_EXIT_CODE=$?
        set -e

        echo "::debug::$RULE_BREACHES"

        EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)

        echo "rule_breaches<<$EOF" >> $GITHUB_OUTPUT
        echo "$RULE_BREACHES" >> $GITHUB_OUTPUT
        echo "$EOF" >> $GITHUB_OUTPUT

        echo "exit_code=$SCAN_EXIT_CODE" >> $GITHUB_OUTPUT

        exit $SCAN_EXIT_CODE
    - id: validate-rules
      if: always() && steps.cache-info.outcome == 'success'
      shell: bash
      env:
        BEARER_RULES_DIRECTORY: ${{ steps.cache-info.outputs.rules-directory }}
      run: bash "$GITHUB_ACTION_PATH/scripts/validate-rules.sh"
    - uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae
      if: success() && steps.rules-cache.outputs.cache-hit != 'true'
      with:
        path: ${{ steps.cache-info.outputs.rules-directory }}
        key: ${{ steps.cache-info.outputs.rules-key }}
